<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Frontier Command</title>
<link rel="stylesheet" href="css/lcars.css">
</head>
<body>
<div id="app" class="app" data-alert="none">
  <!-- Title / new-game screen lives in #screen; the console is #console -->
  <div id="screen" class="screen"></div>

  <div id="console" class="console" hidden>
    <div class="c-elbow-top"><span id="lcarsCode">LCARS 01-4721</span></div>
    <div class="c-top">
      <div class="c-title-row">
        <div class="c-datagrid" id="dataGrid" aria-hidden="true"></div>
        <div class="c-title">
          <div class="c-shipname" id="hdrShip">USS —</div>
          <div class="c-sub"><span id="hdrStardate">STARDATE —</span> <span class="dot">•</span> <span id="hdrAlert">CONDITION GREEN</span></div>
        </div>
      </div>
      <div class="c-bar">
        <span class="seg s-elbow"></span><span class="seg s2"></span><span class="seg s3"></span><span class="seg s4"></span>
        <button class="seg s5 hdr-btn" data-act="toggleSound" id="btnSound">AUDIO ON</button>
        <button class="seg s6 hdr-btn" data-act="menu">MENU</button>
      </div>
    </div>

    <nav class="c-side" id="sideNav" aria-label="Stations">
      <div class="side-cap"></div>
    </nav>

    <main class="c-main"><div class="main-inner" id="main" tabindex="-1"></div></main>

    <div class="c-elbow-bot"><span id="lcarsLoc">SECTOR —</span></div>
    <div class="c-bot">
      <div class="c-bar bot">
        <span class="seg s-elbow"></span><span class="seg s3"></span><span class="seg s2"></span><span class="seg s4"></span>
      </div>
      <div class="c-readouts" id="readouts"></div>
    </div>
  </div>

  <div id="overlay" class="overlay" hidden></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
</div>

<!-- Engine -->
<script src="js/core.js"></script>
<script src="js/data.js"></script>
<script src="assets/manifest.js"></script>
<script src="js/schema.js"></script>
<script src="js/audio.js"></script>
<script src="js/state.js"></script>
<script src="js/galaxy.js"></script>
<script src="js/art.js"></script>
<script src="js/story.js"></script>
<script src="js/missions.js"></script>
<script src="js/diplomacy.js"></script>
<script src="js/combat.js"></script>
<script src="js/ui.js"></script>
<script src="js/stations/bridge.js"></script>
<script src="js/stations/nav.js"></script>
<script src="js/stations/science.js"></script>
<script src="js/stations/tactical.js"></script>
<script src="js/stations/engineering.js"></script>
<script src="js/stations/ops.js"></script>
<script src="js/stations/comms.js"></script>
<script src="js/stations/log.js"></script>

<!-- Content packs: missions and events are pure data. See docs/MISSION_AUTHORING.md -->
<script src="content/events/travel.js"></script>
<script src="content/events/system.js"></script>
<script src="content/events/away.js"></script>
<script src="content/events/hail.js"></script>
<script src="content/missions/core.js"></script>
<script src="content/missions/exploration.js"></script>
<script src="content/missions/diplomatic.js"></script>
<script src="content/missions/crisis.js"></script>
<!-- Add new packs here, e.g. <script src="content/missions/my-pack.js"></script> -->

<script src="js/main.js"></script>
</body>
</html>
